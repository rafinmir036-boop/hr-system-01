<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRMS Enterprise - Human Resource Management Suite</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {

      width: 6px;

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, setDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB20hWCqKPSt2aZxVOYa3cz2FVX2MSCs1U",
      authDomain: "rafin-328ee.firebaseapp.com",
      projectId: "rafin-328ee",
      storageBucket: "rafin-328ee.firebasestorage.app",
      messagingSenderId: "393954293230",
      appId: "1:393954293230:web:03bb7b058a89c339410aff",
      measurementId: "G-0HN3Z0SJ3W"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let employeeList = [];
    let noticeList = [];
    let payrollList = [];
    let leaveList = [];
    let perfList = [];
    let docList = [];
    let advanceList = [];
    let userPermissions = {};
    let currentUserPermissions = {};
    let branchList = [];

    let currentNoticeIndex = 0;
    let noticeInterval = null;
    let currentUserRole = 'Employee';
    let currentUserEmail = '';
    let currentUserBranch = 'ALL';
    let selectedActiveBranch = 'ALL';
    let myEmployeeProfile = null;
    let todayAttendanceData = {};

    let statusChartInstance = null;
    let deptChartInstance = null;
    let parsedBulkEmployees = [];

    window.showToast = function(icon, title) {
      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: icon,
        title: title,
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
      });
    };

    window.loginUser = async function() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      
      if(!email || !pass) {
        showToast('warning', 'দয়া করে ইমেইল ও পাসওয়ার্ড দিন');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>প্রবেশ করা হচ্ছে...';

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        showToast('success', 'লগইন সফল হয়েছে!');
      } catch (err) {
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-login-credentials') {
          try {
            await createUserWithEmailAndPassword(auth, email, pass);
            showToast('success', 'নতুন একাউন্ট সক্রিয় ও লগইন সফল হয়েছে!');
            return;
          } catch (signUpErr) {
            if (signUpErr.code === 'auth/email-already-in-use') {
              Swal.fire({
                icon: 'error',
                title: 'লগইন ব্যর্থ হয়েছে',
                text: 'পাসওয়ার্ডটি সঠিক নয়। অনুগ্রহ করে সঠিক পাসওয়ার্ড দিয়ে চেষ্টা করুন।',
                confirmButtonColor: '#4f46e5'
              });
              return;
            } else if (signUpErr.code === 'auth/weak-password') {
              Swal.fire({
                icon: 'warning',
                title: 'দুর্বল পাসওয়ার্ড',
                text: 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।',
                confirmButtonColor: '#4f46e5'
              });
              return;
            }
          }
        }

        let errMsg = err.message;
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
          errMsg = 'ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।';
        } else if (err.code === 'auth/invalid-email') {
          errMsg = 'ইমেইল ফরম্যাটটি সঠিক নয়।';
        }

        Swal.fire({
          icon: 'error',
          title: 'লগইন ব্যর্থ হয়েছে',
          text: errMsg,
          confirmButtonColor: '#4f46e5'
        });
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Sign In to Dashboard <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>';
      }
    };

    window.logoutUser = function() {
      Swal.fire({
        title: 'লগআউট করতে চান?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#e11d48',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'হ্যাঁ, লগআউট',
        cancelButtonText: 'বাতিল'
      }).then((result) => {
        if (result.isConfirmed) {
          signOut(auth);
        }
      });
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-email').innerText = user.email;
        document.getElementById('header-user-avatar').innerText = user.email.charAt(0).toUpperCase();
        currentUserEmail = user.email.toLowerCase();
        
        const todayStr = new Date().toISOString().split('T')[0];
        const currentMonthStr = todayStr.substring(0, 7);
        
        document.getElementById('att-date').value = todayStr;
        if(document.getElementById('adv-filter-month')) {
          document.getElementById('adv-filter-month').value = currentMonthStr;
        }
        if(document.getElementById('rep-month')) {
          document.getElementById('rep-month').value = currentMonthStr;
        }
        if(document.getElementById('rep-date')) {
          document.getElementById('rep-date').value = todayStr;
        }

        loadBranchesRealtime();
        loadPermissionsRealtime(user.email);
        loadEmployeesRealtime();
        listenTodayAttendance(todayStr);
        loadLeaveRequestsRealtime();
        loadPayrollRealtime();
        loadAdvancesRealtime();
        loadCompanyDocsRealtime();
        loadPerformanceRealtime();
        loadNoticesRealtime();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    // ==========================================
    // MULTI-BRANCH SYSTEM & FILTER HELPERS
    // ==========================================
    function loadBranchesRealtime() {
      onSnapshot(collection(db, "branches"), (snapshot) => {
        const storedBranches = [];
        const tbody = document.getElementById('branch-table-body');
        if (tbody) tbody.innerHTML = '';

        snapshot.forEach(docSnap => {
          const b = docSnap.data();
          storedBranches.push(b.name);
          if (tbody) {
            tbody.innerHTML += `
              <tr class="border-b border-slate-100 hover:bg-slate-50 transition text-xs">
                <td class="px-4 py-3 font-bold text-slate-800">${b.name}</td>
                <td class="px-4 py-3"><span class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-bold text-[10px]">${b.code || 'BR'}</span></td>
                <td class="px-4 py-3 text-slate-600">${b.city || '-'}</td>
                <td class="px-4 py-3 text-slate-600 font-medium">${b.managerEmail || 'Unassigned'}</td>
                <td class="px-4 py-3 text-right">
                  <button onclick="deleteBranchRecord('${docSnap.id}')" class="text-rose-500 hover:text-rose-700 p-1.5 rounded hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i></button>
                </td>
              </tr>
            `;
          }
        });

        if (tbody && storedBranches.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400 text-xs font-medium">কোনো ব্রাঞ্চ যুক্ত করা হয়নি। উপরের ফর্ম থেকে ব্রাঞ্চ তৈরি করুন।</td></tr>`;
        }

        branchList = storedBranches;
        populateBranchSelectDropdowns();
      });
    }

    function populateBranchSelectDropdowns() {
      const headerSelect = document.getElementById('header-branch-select');
      const empBranchSelect = document.getElementById('emp-branch');
      const permBranchSelect = document.getElementById('perm-branch');
      const repBranchSelect = document.getElementById('rep-filter-branch');
      const bulkBranchSelect = document.getElementById('bulk-default-branch');

      if (headerSelect) {
        let opts = `<option value="ALL">🏢 All Branches (Global)</option>`;
        branchList.forEach(b => { opts += `<option value="${b}">📍 ${b}</option>`; });
        headerSelect.innerHTML = opts;
        headerSelect.value = (branchList.includes(selectedActiveBranch) || selectedActiveBranch === 'ALL') ? selectedActiveBranch : 'ALL';
      }

      if (empBranchSelect) {
        let opts = '';
        if (branchList.length === 0) {
          opts = `<option value="Main Branch">Main Branch</option>`;
        } else {
          branchList.forEach(b => { opts += `<option value="${b}">${b}</option>`; });
        }
        empBranchSelect.innerHTML = opts;
      }

      if (permBranchSelect) {
        let opts = `<option value="ALL">All Branches (Head Office / Super Admin)</option>`;
        branchList.forEach(b => { opts += `<option value="${b}">Only: ${b}</option>`; });
        permBranchSelect.innerHTML = opts;
      }

      if (repBranchSelect) {
        let opts = `<option value="ALL">All Branches</option>`;
        branchList.forEach(b => { opts += `<option value="${b}">${b}</option>`; });
        repBranchSelect.innerHTML = opts;
      }

      if (bulkBranchSelect) {
        let opts = '';
        if (branchList.length === 0) {
          opts = `<option value="Main Branch">Main Branch</option>`;
        } else {
          branchList.forEach(b => { opts += `<option value="${b}">${b}</option>`; });
        }
        bulkBranchSelect.innerHTML = opts;
      }

      const noticeBranchSelect = document.getElementById('notice-target-branch');
      if (noticeBranchSelect) {
        let opts = `<option value="ALL">🌐 All Branches & Head Office (সবার জন্য)</option>`;
        opts += `<option value="Head Office">🏢 Head Office Only (শুধুমাত্র হেড অফিস)</option>`;
        branchList.forEach(b => {
          if (b !== 'Head Office') {
            opts += `<option value="${b}">📍 Only: ${b}</option>`;
          }
        });
        noticeBranchSelect.innerHTML = opts;
      }
    }

    window.onHeaderBranchChange = function() {
      const select = document.getElementById('header-branch-select');
      selectedActiveBranch = select.value;
      
      updateAttendanceDashboardMetrics();
      renderAttendanceTable();
      renderAdvanceTable();
      checkIncrementDues();
      generateReport();
      renderDashboardCharts();
      loadEmployeesRealtime();
      renderNotices();
      showToast('info', `ফিল্টার করা হয়েছে: ${selectedActiveBranch === 'ALL' ? 'সকল ব্রাঞ্চ' : selectedActiveBranch}`);
    };

    window.isItemInActiveBranch = function(itemBranch) {
      const branchName = itemBranch || 'Head Office';
      if (currentUserRole === 'Employee') return true;
      
      if (['Manager', 'Branch Manager'].includes(currentUserRole)) {
        return currentUserBranch === 'ALL' || branchName === currentUserBranch;
      }

      if (currentUserRole === 'Admin') {
        if (!selectedActiveBranch || selectedActiveBranch === 'ALL') return true;
        return branchName === selectedActiveBranch;
      }

      return true;
    };

    window.saveNewBranch = async function(e) {
      e.preventDefault();
      const name = document.getElementById('branch-new-name').value.trim();
      const code = document.getElementById('branch-new-code').value.trim();
      const city = document.getElementById('branch-new-city').value.trim();

      if (!name) {
        showToast('warning', 'ব্রাঞ্চের নাম প্রদান করুন');
        return;
      }

      try {
        await addDoc(collection(db, "branches"), {
          name, 
          code: code || 'BR', 
          city: city || 'Bangladesh', 
          createdAt: new Date().toISOString()
        });
        document.getElementById('branch-form').reset();
        showToast('success', `নতুন ব্রাঞ্চ "${name}" যুক্ত হয়েছে!`);
      } catch (err) {
        showToast('error', err.message);
      }
    };

    window.deleteBranchRecord = async function(id) {
      if (confirm("এই ব্রাঞ্চ মুছে ফেলতে চান?")) {
        await deleteDoc(doc(db, "branches", id));
        showToast('success', 'ব্রাঞ্চ মুছে ফেলা হয়েছে');
      }
    };

    // ==========================================
    // ROLE PERMISSIONS & GRANULAR ACCESS CONTROL
    // ==========================================
    const PERMISSION_KEYS = [
      'can_dashboard',
      'can_employees',
      'can_attendance',
      'can_advance_apply',
      'can_advance_approve',
      'can_leave_apply',
      'can_leave_approve',
      'can_payroll',
      'can_increment',
      'can_documents',
      'can_performance',
      'can_notices',
      'can_reports',
      'can_settings'
    ];

    function getDefaultPermissionsForRole(role) {
      if (role === 'Admin') {
        return {
          can_dashboard: true, can_employees: true, can_attendance: true,
          can_advance_apply: true, can_advance_approve: true, can_leave_apply: true,
          can_leave_approve: true, can_payroll: true, can_increment: true,
          can_documents: true, can_performance: true, can_notices: true,
          can_reports: true, can_settings: true
        };
      } else if (role === 'Operation' || role === 'Operations Manager') {
        return {
          can_dashboard: true, can_employees: true, can_attendance: true,
          can_advance_apply: true, can_advance_approve: true, can_leave_apply: true,
          can_leave_approve: true, can_payroll: true, can_increment: true,
          can_documents: true, can_performance: true, can_notices: true,
          can_reports: true, can_settings: false
        };
      } else if (role === 'Area Manager') {
        return {
          can_dashboard: true, can_employees: true, can_attendance: true,
          can_advance_apply: true, can_advance_approve: true, can_leave_apply: true,
          can_leave_approve: true, can_payroll: false, can_increment: false,
          can_documents: true, can_performance: true, can_notices: true,
          can_reports: true, can_settings: false
        };
      } else if (role === 'Manager' || role === 'Branch Manager') {
        return {
          can_dashboard: true, can_employees: true, can_attendance: true,
          can_advance_apply: true, can_advance_approve: false, can_leave_apply: true,
          can_leave_approve: false, can_payroll: false, can_increment: false,
          can_documents: false, can_performance: false, can_notices: true,
          can_reports: true, can_settings: false
        };
      } else { // Employee
        return {
          can_dashboard: true, can_employees: false, can_attendance: false,
          can_advance_apply: true, can_advance_approve: false, can_leave_apply: true,
          can_leave_approve: false, can_payroll: false, can_increment: false,
          can_documents: false, can_performance: false, can_notices: true,
          can_reports: false, can_settings: false
        };
      }
    }

    window.hasPermission = function(permKey) {
      if (currentUserRole === 'Admin') return true;
      if (currentUserPermissions && currentUserPermissions[permKey] !== undefined) {
        return !!currentUserPermissions[permKey];
      }
      const defs = getDefaultPermissionsForRole(currentUserRole);
      return !!defs[permKey];
    };

    window.onRolePresetChanged = function() {
      const role = document.getElementById('perm-role').value;
      if (role === 'Custom') return;

      const defs = getDefaultPermissionsForRole(role);
      PERMISSION_KEYS.forEach(key => {
        const cb = document.getElementById('perm_' + key);
        if (cb) cb.checked = !!defs[key];
      });
    };

    window.selectAllPermissions = function(val) {
      PERMISSION_KEYS.forEach(key => {
        const cb = document.getElementById('perm_' + key);
        if (cb) cb.checked = !!val;
      });
      const roleSelect = document.getElementById('perm-role');
      if (roleSelect && roleSelect.value !== 'Admin' && val) {
        roleSelect.value = 'Custom';
      }
    };

    window.editUserRolePermission = function(docId, docJsonStr) {
      try {
        const data = typeof docJsonStr === 'string' ? JSON.parse(docJsonStr) : docJsonStr;
        document.getElementById('perm-doc-id').value = docId;
        document.getElementById('perm-email').value = data.email || '';
        document.getElementById('perm-role').value = data.role || 'Employee';
        document.getElementById('perm-branch').value = data.branch || 'ALL';
        document.getElementById('perm-user-pass').value = data.assignedPassword || '';

        const perms = data.permissions || getDefaultPermissionsForRole(data.role);
        PERMISSION_KEYS.forEach(key => {
          const cb = document.getElementById('perm_' + key);
          if (cb) cb.checked = !!perms[key];
        });

        const submitBtn = document.getElementById('perm-submit-btn');
        if (submitBtn) submitBtn.innerText = 'Update Role & Permissions (আপডেট করুন)';
        const cancelBtn = document.getElementById('perm-cancel-edit-btn');
        if (cancelBtn) cancelBtn.classList.remove('hidden');

        const card = document.getElementById('sec-settings-roles');
        if (card) card.scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        console.error("Error editing role:", e);
      }
    };

    window.resetPermForm = function() {
      const form = document.getElementById('perm-form');
      if (form) form.reset();
      const docIdInput = document.getElementById('perm-doc-id');
      if (docIdInput) docIdInput.value = '';
      const submitBtn = document.getElementById('perm-submit-btn');
      if (submitBtn) submitBtn.innerText = 'Save Role & Permissions';
      const cancelBtn = document.getElementById('perm-cancel-edit-btn');
      if (cancelBtn) cancelBtn.classList.add('hidden');
      onRolePresetChanged();
    };

    function renderAssignedRolesTable(rolesList) {
      const tbody = document.getElementById('perm-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (rolesList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-slate-400 font-medium">কোনো ইউজার পারমিশন পাওয়া যায়নি</td></tr>';
        return;
      }

      rolesList.forEach((p) => {
        const perms = p.permissions || getDefaultPermissionsForRole(p.role);
        const permKeys = Object.keys(perms).filter(k => perms[k]);
        const permCount = permKeys.length;
        
        let permBadges = '';
        if (p.role === 'Admin') {
          permBadges = '<span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded text-[10px] font-bold border border-purple-200">Full Access</span>';
        } else if (permCount > 0) {
          permBadges = `<span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-bold border border-indigo-100">${permCount} Permissions</span>`;
        } else {
          permBadges = `<span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-[10px] font-medium">Limited</span>`;
        }

        const encodedDoc = encodeURIComponent(JSON.stringify(p));

        tbody.innerHTML += `
          <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition text-xs">
            <td class="px-4 py-3">
              <div class="font-bold text-slate-800">${p.email}</div>
              <div class="text-[10px] text-slate-400 font-mono">Pass: ${p.assignedPassword || '******'}</div>
            </td>
            <td class="px-4 py-3">
              <span class="px-2.5 py-0.5 rounded-full font-bold ${getRoleBadge(p.role)}">${p.role}</span>
            </td>
            <td class="px-4 py-3 text-slate-600 font-bold">
              <span class="bg-slate-100 px-2 py-0.5 rounded text-indigo-700 font-semibold text-[11px]">🏢 ${p.branch || 'ALL'}</span>
            </td>
            <td class="px-4 py-3">${permBadges}</td>
            <td class="px-4 py-3 text-right space-x-1 whitespace-nowrap">
              <button onclick="editUserRolePermission('${p.id}', decodeURIComponent('${encodedDoc}'))" title="Edit Role" class="text-indigo-600 hover:text-indigo-800 p-1.5 rounded-lg hover:bg-indigo-50 transition"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="deletePermissionRole('${p.id}')" title="Delete User" class="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg hover:bg-rose-50 transition"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function loadPermissionsRealtime(userEmail) {
      onSnapshot(collection(db, "user_roles"), (snapshot) => {
        userPermissions = {};
        const rolesList = [];

        snapshot.forEach((docSnap) => {
          const p = docSnap.data();
          const id = docSnap.id;
          rolesList.push({ id, ...p });
          userPermissions[p.email.toLowerCase()] = {
            id: id,
            role: p.role,
            branch: p.branch || 'ALL',
            permissions: p.permissions || getDefaultPermissionsForRole(p.role)
          };
        });

        renderAssignedRolesTable(rolesList);

        const assignedInfo = userPermissions[userEmail.toLowerCase()];
        if (assignedInfo) {
          currentUserRole = assignedInfo.role;
          currentUserBranch = assignedInfo.branch || 'ALL';
          currentUserPermissions = assignedInfo.permissions || getDefaultPermissionsForRole(assignedInfo.role);
        } else {
          currentUserRole = 'Admin';

      if (role === 'Area Manager') return 'bg-indigo-50 text-indigo-700 border-indigo-200';
      if (role === 'Manager' || role === 'Branch Manager') return 'bg-blue-50 text-blue-700 border-blue-200';

    window.previewEmployeePhoto = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300, maxH = 300;
          let width = img.width, height = img.height;
          if (width > height) {
            if (width > maxW) { height *= maxW / width; width = maxW; }
          } else {
            if (height > maxH) { width *= maxH / height; height = maxH; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('emp-photo').value = dataUrl;
          const preview = document.getElementById('emp-photo-preview');
          if (preview) preview.src = dataUrl;
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.handleZKLogUpload = async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const selectedDate = document.getElementById('att-date').value;
      const reader = new FileReader();

      reader.onload = async function(event) {
        const text = event.target.result;
        const lines = text.split('\n');
        let matchedCount = 0;

        Swal.fire({
          title: 'পাঞ্চ ডাটা সিঙ্ক হচ্ছে...',
          text: 'ZKTeco ফাইল থেকে উপস্থিতি আপডেট করা হচ্ছে',
          allowOutsideClick: false,
          didOpen: () => { Swal.showLoading(); }
        });

        for (let line of lines) {
          line = line.trim();
          if (!line) continue;

          const tokens = line.split(/[\t,; ]+/);
          const candidateId = tokens[0];
          const timeToken = tokens.find(t => t.includes(':')) || '10:00:00';

          const emp = employeeList.find(e => e.customEmpCode == candidateId || e.id == candidateId);
          if (emp && isItemInActiveBranch(emp.branch)) {
            const isLate = timeToken > '09:30:00';
            const status = isLate ? 'Late' : 'Present';

            await setDoc(doc(db, `attendance_${selectedDate}`, emp.id), {
              employeeId: emp.id,
              customEmpCode: emp.customEmpCode || candidateId,
              branch: emp.branch || 'Head Office',
              status: status,
              punchTime: timeToken,
              method: 'ZKTeco Machine Punch',
              updatedAt: new Date().toISOString()
            });
            matchedCount++;
          }
        }

        Swal.fire('সিঙ্ক সম্পন্ন!', `মোট ${matchedCount} জন কর্মচারীর বায়োমেট্রিক উপস্থিতি আপডেট হয়েছে!`, 'success');
      };
      reader.readAsText(file);
    };

    // Reports Engine
    window.onReportTypeChange = function() {
      const type = document.getElementById('rep-type') ? document.getElementById('rep-type').value : 'attendance_summary';
      const monthBox = document.getElementById('rep-month-box');
      const dateBox = document.getElementById('rep-date-box');

      if (monthBox && dateBox) {
        if (type === 'attendance_daily') {
          monthBox.classList.add('hidden');
          dateBox.classList.remove('hidden');
        } else {
          monthBox.classList.remove('hidden');
          dateBox.classList.add('hidden');
        }
      }
      generateReport();
    };

    window.generateReport = async function() {
      const type = document.getElementById('rep-type') ? document.getElementById('rep-type').value : 'attendance_summary';
      const monthInput = document.getElementById('rep-month');
      const month = monthInput && monthInput.value ? monthInput.value : new Date().toISOString().substring(0, 7);
      const dateInput = document.getElementById('rep-date');
      const singleDate = dateInput && dateInput.value ? dateInput.value : new Date().toISOString().split('T')[0];
      const filterBranch = document.getElementById('rep-filter-branch') ? document.getElementById('rep-filter-branch').value : 'ALL';
      const filterEmpId = document.getElementById('rep-filter-emp') ? document.getElementById('rep-filter-emp').value : 'ALL';

      const tableHead = document.getElementById('rep-table-head');
      const tableBody = document.getElementById('rep-table-body');
      const statsBox = document.getElementById('rep-stats-container');
      const monthBox = document.getElementById('rep-month-box');
      const dateBox = document.getElementById('rep-date-box');

      if (monthBox && dateBox) {
        if (type === 'attendance_daily') {
          monthBox.classList.add('hidden');
          dateBox.classList.remove('hidden');
        } else {
          monthBox.classList.remove('hidden');
          dateBox.classList.add('hidden');
        }
      }

      if(!tableHead || !tableBody) return;
      tableHead.innerHTML = '';
      tableBody.innerHTML = '<tr><td colspan="10" class="py-8 text-center text-slate-400 font-medium"><i class="fa-solid fa-circle-notch fa-spin mr-2 text-indigo-600"></i>রিপোর্ট তৈরি হচ্ছে...</td></tr>';

      if (type === 'attendance_summary') {
        if (statsBox) statsBox.classList.remove('hidden');

        const [yearStr, mStr] = month.split('-');
        const y = parseInt(yearStr);
        const m = parseInt(mStr);
        const daysInMonth = new Date(y, m, 0).getDate();

        const today = new Date();
        const isCurrentMonth = today.getFullYear() === y && (today.getMonth() + 1) === m;
        const maxDay = isCurrentMonth ? Math.min(today.getDate(), daysInMonth) : daysInMonth;

        const dailyPromises = [];
        for (let d = 1; d <= maxDay; d++) {
          const dStr = `${yearStr}-${mStr}-${String(d).padStart(2, '0')}`;
          dailyPromises.push(
            getDocs(collection(db, `attendance_${dStr}`)).then(snap => {
              const dayMap = {};
              snap.forEach(docSnap => {
                const data = docSnap.data();
                const k1 = data.employeeId || docSnap.id;
                dayMap[k1] = data;
                if (data.customEmpCode) dayMap[data.customEmpCode] = data;
              });
              return { date: dStr, logs: dayMap };
            }).catch(() => ({ date: dStr, logs: {} }))
          );
        }

        const monthDaysResults = await Promise.all(dailyPromises);

        const targetEmployees = employeeList.filter(emp => {
          if (filterBranch !== 'ALL' && emp.branch !== filterBranch) return false;
          if (!isItemInActiveBranch(emp.branch)) return false;
          if (filterEmpId !== 'ALL' && emp.id !== filterEmpId) return false;
          return true;
        });

        let grandTotalPresent = 0, grandTotalLate = 0, grandTotalAbsent = 0, grandTotalDayOff = 0, grandTotalLeave = 0;

        tableHead.innerHTML = `
          <tr>
            <th class="px-4 py-3.5">Employee Name & ID</th>
            <th class="px-4 py-3.5">Branch</th>
            <th class="px-4 py-3.5">Designation & Dept</th>
            <th class="px-4 py-3.5 text-center">Total Days</th>
            <th class="px-4 py-3.5 text-center">🟢 Present</th>
            <th class="px-4 py-3.5 text-center">🟡 Late</th>
            <th class="px-4 py-3.5 text-center">🔴 Absent</th>
            <th class="px-4 py-3.5 text-center">🔵 Day Off</th>
            <th class="px-4 py-3.5 text-center">🟣 Leave</th>
            <th class="px-4 py-3.5 text-center">Attendance %</th>
          </tr>
        `;

        tableBody.innerHTML = '';

        if (targetEmployees.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="10" class="py-6 text-center text-slate-400 font-medium">কোনো কর্মচারীর ডাটা পাওয়া যায়নি</td></tr>';
          return;
        }

        targetEmployees.forEach(emp => {
          let empPresent = 0, empLate = 0, empAbsent = 0, empDayOff = 0, empLeave = 0;

          monthDaysResults.forEach(({ date, logs }) => {
            const rec = logs[emp.id] || (emp.customEmpCode ? logs[emp.customEmpCode] : null);
            let st = rec ? (typeof rec === 'object' ? rec.status : rec) : null;

            if (!st) {
              const hasLeave = leaveList.some(l => 
                l.employeeId === emp.id && 
                l.status === 'Approved' && 
                date >= l.startDate && 
                date <= l.endDate
              );
              if (hasLeave) st = 'On Leave';
            }

            if (st === 'Present') empPresent++;
            else if (st === 'Late') empLate++;
            else if (st === 'Day Off') empDayOff++;
            else if (st === 'On Leave') empLeave++;
            else empAbsent++;
          });

          grandTotalPresent += empPresent;
          grandTotalLate += empLate;
          grandTotalAbsent += empAbsent;
          grandTotalDayOff += empDayOff;
          grandTotalLeave += empLeave;

          const totalTracked = maxDay;
          const totalWorking = totalTracked - empDayOff;
          const attendancePercent = totalWorking > 0 ? Math.round(((empPresent + empLate) / totalWorking) * 100) : 100;

          let rateBadge = 'bg-emerald-50 text-emerald-700 border-emerald-200';
          if (attendancePercent < 75) rateBadge = 'bg-rose-50 text-rose-700 border-rose-200';
          else if (attendancePercent < 90) rateBadge = 'bg-amber-50 text-amber-700 border-amber-200';

          tableBody.innerHTML += `
            <tr class="border-b border-slate-100 hover:bg-slate-50 transition text-xs">
              <td class="px-4 py-3">
                <div class="font-bold text-slate-800">${emp.name}</div>
                <div class="text-[11px] text-indigo-600 font-semibold">ID: ${emp.customEmpCode || 'N/A'} • ${emp.email || ''}</div>
              </td>
              <td class="px-4 py-3 font-semibold text-emerald-800">
                <span class="bg-emerald-50 border border-emerald-100 px-2 py-0.5 rounded-full">🏢 ${emp.branch || 'Head Office'}</span>
              </td>
              <td class="px-4 py-3 text-slate-600 font-medium">${emp.designation} <span class="text-slate-400">(${emp.department})</span></td>
              <td class="px-4 py-3 text-center font-bold text-slate-700">${totalTracked} Days</td>
              <td class="px-4 py-3 text-center"><span class="bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-2.5 py-1 rounded-full text-xs">${empPresent} Days</span></td>
              <td class="px-4 py-3 text-center"><span class="bg-amber-50 text-amber-700 border border-amber-200 font-bold px-2.5 py-1 rounded-full text-xs">${empLate} Days</span></td>
              <td class="px-4 py-3 text-center"><span class="bg-rose-50 text-rose-700 border border-rose-200 font-bold px-2.5 py-1 rounded-full text-xs">${empAbsent} Days</span></td>
              <td class="px-4 py-3 text-center"><span class="bg-sky-50 text-sky-700 border border-sky-200 font-bold px-2.5 py-1 rounded-full text-xs">${empDayOff} Days</span></td>
              <td class="px-4 py-3 text-center"><span class="bg-purple-50 text-purple-700 border border-purple-200 font-bold px-2.5 py-1 rounded-full text-xs">${empLeave} Days</span></td>
              <td class="px-4 py-3 text-center">
                <span class="px-2.5 py-1 rounded-full font-bold border text-xs ${rateBadge}">${attendancePercent}%</span>
              </td>
            </tr>
          `;
        });

        if (document.getElementById('rep-stat-present')) document.getElementById('rep-stat-present').innerText = `${grandTotalPresent} Days`;
        if (document.getElementById('rep-stat-late')) document.getElementById('rep-stat-late').innerText = `${grandTotalLate} Days`;
        if (document.getElementById('rep-stat-absent')) document.getElementById('rep-stat-absent').innerText = `${grandTotalAbsent} Days`;
        if (document.getElementById('rep-stat-dayoff')) document.getElementById('rep-stat-dayoff').innerText = `${grandTotalDayOff} Days`;
        if (document.getElementById('rep-stat-leave')) document.getElementById('rep-stat-leave').innerText = `${grandTotalLeave} Days`;
      }
    };

    window.exportReportToCSV = function() {
      const table = document.getElementById('rep-table');
      let csv = [];
      for (let i = 0; i < table.rows.length; i++) {
        let row = [], cols = table.rows[i].querySelectorAll("td, th");
        for (let j = 0; j < cols.length; j++) 
          row.push('"' + cols[j].innerText.replace(/"/g, '""') + '"');
        csv.push(row.join(","));
      }
      const csvBlob = new Blob(["\uFEFF" + csv.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(csvBlob);
      link.download = `HRMS_Report_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    };

    window.toggleModal = function(id, show) {
      const modal = document.getElementById(id);
      if(!modal) return;
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    };

    window.switchNav = function(secId) {
      const sections = document.querySelectorAll('section');
      sections.forEach(s => s.classList.add('hidden'));

      const target = document.getElementById(`sec-${secId}`);
      if(target) target.classList.remove('hidden');

      const navButtons = document.querySelectorAll('#sidebar-nav button');
      navButtons.forEach(b => b.classList.remove('sidebar-active'));

      const activeBtn = document.getElementById(`nav-${secId}`);
      if(activeBtn) activeBtn.classList.add('sidebar-active');

      const pageTitle = document.getElementById('page-title');
      if (pageTitle) {
        pageTitle.innerText = secId.charAt(0).toUpperCase() + secId.slice(1);
      }
    };
  </script>
</head>
